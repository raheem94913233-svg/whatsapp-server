services:
  - type: web
    name: school-whatsapp
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SERVICE_TOKEN
        generateValue: true
      - key: FIREBASE_DB_URL
        value: https://ghiabi-default-rtdb.firebaseio.com
      - key: AUTH_DIR
        value: ./auth
